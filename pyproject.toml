[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcrisk"
version = "0.1.0"
description = "Monte Carlo portfolio risk: simulate 10,000 one-month futures, measure VaR and expected shortfall, and show how correlation drives portfolio risk."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "matplotlib>=3.8"]

[project.optional-dependencies]
data = ["yfinance>=0.2.50"]
dev = ["pytest>=8"]

[project.scripts]
mcrisk = "mcrisk.cli:main"

[tool.setuptools]
packages = ["mcrisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
